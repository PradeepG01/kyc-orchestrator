services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://kyc:kyc@db:5432/kyc
      API_KEYS: demo:dev-key
      WEBHOOK_SECRET: dev-webhook-secret
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://kyc:kyc@db:5432/kyc
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: kyc
      POSTGRES_DB: kyc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc"]
      interval: 5s
      retries: 10
