apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-orchestrator
  labels: {app: kyc-orchestrator}
spec:
  replicas: 3
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # zero-downtime deploys
  selector:
    matchLabels: {app: kyc-orchestrator}
  template:
    metadata:
      labels: {app: kyc-orchestrator}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: ghcr.io/your-github-username/kyc-orchestrator:latest
          ports: [{containerPort: 3000}]
          envFrom:
            - secretRef: {name: kyc-orchestrator-secrets}   # DATABASE_URL, API_KEYS, WEBHOOK_SECRET
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-orchestrator
spec:
  selector: {app: kyc-orchestrator}
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kyc-orchestrator
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: kyc-orchestrator}
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
